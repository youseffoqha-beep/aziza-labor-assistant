<style>
  :root {
    --bg: #F6F8F6;
    --panel: #FFFFFF;
    --ink: #23282B;
    --ink-soft: #5C6B62;
    --green: #2E9E44;
    --green-deep: #1F7A34;
    --navy: #1E1B4A;
    --navy-deep: #141138;
    --gold: #F0C800;
    --line: #DEE4DE;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', Tahoma, Geneva, Arial, sans-serif;
  }

  .app {
    max-width: 760px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    overflow: hidden;
  }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 22px;
    background: var(--navy);
    flex-shrink: 0;
    border-bottom: 3px solid var(--gold);
  }

  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 46px; height: 46px;
    border-radius: 50%;
    flex-shrink: 0;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(255,255,255,.25);
  }
  .brand-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .brand-text h1 { margin: 0; font-size: 21px; font-weight: 800; color: #fff; line-height: 1.3; }
  .brand-text p { margin: 3px 0 0; font-size: 12px; color: #C9CEE8; line-height: 1.4; }

  .reset-btn {
    font-family: inherit; background: transparent; border: 1px solid #3A3770;
    color: #D8DCF2; font-size: 13px; padding: 8px 13px; border-radius: 6px;
    cursor: pointer; flex-shrink: 0; transition: border-color .15s ease, color .15s ease;
  }
  .reset-btn:hover { border-color: var(--gold); color: var(--gold); }

  .topic-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    background: var(--bg); flex-shrink: 0;
  }
  .topic-label { font-size: 12.5px; color: var(--ink-soft); margin-left: 2px; }
  .topic-chip {
    font-family: inherit; font-size: 12.5px; padding: 6px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink); cursor: pointer; transition: border-color .15s ease, color .15s ease;
  }
  .topic-chip:hover { border-color: var(--green); color: var(--green-deep); }

  .chat-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .chat-log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }

  .welcome {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 20px; font-size: 14.5px; line-height: 1.8;
  }
  .welcome p { margin: 0 0 14px; color: var(--ink); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-family: inherit; font-size: 13.5px; padding: 9px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    color: var(--ink); cursor: pointer; transition: border-color .15s ease, color .15s ease;
  }
  .chip:hover { border-color: var(--green); color: var(--green-deep); }

  .msg { max-width: 82%; padding: 12px 16px; border-radius: 4px; line-height: 1.7; font-size: 15px; white-space: pre-wrap; }
  .msg-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 600; }
  .msg.user { margin-left: auto; margin-right: 0; background: #F0F1FA; border-right: 3px solid var(--navy); }
  .msg.assistant { margin-right: auto; margin-left: 0; background: #F1FAF3; border-left: 3px solid var(--green); }
  .msg.assistant.secondary { opacity: .88; font-size: 14px; padding: 10px 14px; }
  .msg.error { margin-right: auto; margin-left: 0; background: #FBEFEC; border-left: 3px solid #C24A3B; }

  .category-block { max-width: 96%; }
  .category-title { font-weight: 700; margin: 2px 0 10px; }
  .category-item { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .category-item:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
  .category-q { font-weight: 600; margin-bottom: 4px; }
  .category-a { color: var(--ink-soft); font-size: 14px; line-height: 1.7; }

  .typing { display: flex; align-items: center; gap: 6px; margin-right: auto; margin-left: 0; padding: 10px 6px; }
  .typing .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft); animation: blink 1.2s infinite ease-in-out; }
  .typing .dot:nth-child(2) { animation-delay: .2s; }
  .typing .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .composer { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--line); background: var(--panel); flex-shrink: 0; }
  #messageInput {
    flex: 1; min-width: 0; font-family: inherit; font-size: 15px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink);
  }
  #messageInput:focus { outline: none; border-color: var(--green); }

  #searchBtn {
    font-family: inherit; font-weight: 700; font-size: 14px; padding: 0 22px;
    background: var(--green); color: #fff; border: none; border-radius: 6px;
    cursor: pointer; transition: background .15s ease; flex-shrink: 0;
  }
  #searchBtn:hover:not(:disabled) { background: var(--green-deep); }
  #searchBtn:disabled { opacity: .5; cursor: not-allowed; }

  @media (max-width: 480px) {
    .app-header { padding: 13px 16px; }
    .topic-row { padding: 10px 14px; }
    .composer { padding: 12px 14px; }
    .chat-log { padding: 14px; }
    .msg { max-width: 90%; font-size: 14.5px; }
    .brand-text h1 { font-size: 18px; }
    .brand-mark { width: 38px; height: 38px; }
  }
</style>
</head>
<body>
  <div class="app">

      // مطابقة داخل نص الجواب نفسه تدخل بوزن خفيف جدًا فقط، ولا تُحتسب كدليل مؤهّل
      // بمفردها - عشان كلمات عامة متكررة بكل الأجوبة ما تصنع تطابق وهمي واثق
      if (entry._aTokens.has(qt)) score += 0.3 * w;
    });
    // يتأهل المرشح فقط إذا كان فيه دليل حقيقي: إما كلمتان مختلفتان على الأقل من
    // نص السؤال/الكلمات المفتاحية، أو كلمة واحدة لكنها مميزة جدًا (نادرة بقاعدة المعرفة)
    const strongHit = qHitWeights.some(w => w >= 2.6);
    const qualifies = qHitWeights.length >= 2 || strongHit;
    return { score, qualifies };
  }

  function findBestMatches(query) {
    const qTokens = tokenize(query);
    if (qTokens.length === 0) return [];
    return KNOWLEDGE_BASE.map(e => {
      const d = scoreEntryDetailed(qTokens, e);
      return { entry: e, score: d.score, qualifies: d.qualifies };
    })
      .filter(s => s.qualifies && s.score > 0)
      .sort((a, b) => b.score - a.score);
  }

  // ============ الواجهة ============
  const chatLog = document.getElementById('chatLog');
  let welcome = document.getElementById('welcome');
  const input = document.getElementById('messageInput');
  const searchBtn = document.getElementById('searchBtn');
  const resetBtn = document.getElementById('resetBtn');
  const chipsWrap = document.getElementById('chips');
  const topicRow = document.getElementById('topicRow');

  let isLoading = false;

  const categories = [...new Set(KNOWLEDGE_BASE.map(e => e.category))];
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'topic-chip';
    btn.type = 'button';
    btn.textContent = cat;
    btn.addEventListener('click', () => renderCategoryBrowse(cat));
    topicRow.appendChild(btn);
  });

  const FEATURED_QUESTIONS = [
    'ما هي معدات الحماية الشخصية المطلوبة؟',
    'شو تعليمات منطقة الذبح؟',
    'شو مواصفات دجاج KFC الطازج والمجمد؟',
    'كيف يشتغل جهاز كشف المعادن وشو حساسيته؟',
    'شو أعمل إذا انقطعت الكهرباء؟'
  ];
  FEATURED_QUESTIONS.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.type = 'button';
    btn.textContent = q;
    btn.addEventListener('click', () => handleSearch(q));
    chipsWrap.appendChild(btn);
  });

  function scrollToBottom() { chatLog.scrollTop = chatLog.scrollHeight; }

  function renderMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'أنت' : 'مرشد';
    const body = document.createElement('div');
    body.textContent = text;
    wrap.appendChild(label);
    wrap.appendChild(body);
    chatLog.appendChild(wrap);
    scrollToBottom();
  }

  function renderAnswerBlock(entry, isSecondary) {
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant' + (isSecondary ? ' secondary' : '');
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = isSecondary ? 'قد يفيدك أيضًا' : 'مرشد';
    const body = document.createElement('div');
    body.textContent = entry.answer;
    wrap.appendChild(label);
    wrap.appendChild(body);
    chatLog.appendChild(wrap);
  }

  function renderCategoryBrowse(category) {
    if (welcome) { welcome.remove(); welcome = null; }
    const entries = KNOWLEDGE_BASE.filter(e => e.category === category);
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant category-block';
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'مرشد';
    const title = document.createElement('div');
    title.className = 'category-title';
    title.textContent = category + ' (' + entries.length + ' سؤال)';
    wrap.appendChild(label);
    wrap.appendChild(title);
    entries.forEach(e => {
      const item = document.createElement('div');
      item.className = 'category-item';
      const q = document.createElement('div');
      q.className = 'category-q';
      q.textContent = '• ' + e.question;
      const a = document.createElement('div');
      a.className = 'category-a';
      a.textContent = e.answer;
      item.appendChild(q);
      item.appendChild(a);
      wrap.appendChild(item);
    });
    chatLog.appendChild(wrap);
    scrollToBottom();
  }

  function renderDisambiguation(candidates) {
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'مرشد';
    const body = document.createElement('div');
    body.textContent = 'في أكثر من سؤال قريب من اللي سألته - اختر الأقرب لقصدك:';
    wrap.appendChild(label);
    wrap.appendChild(body);
    const optWrap = document.createElement('div');
    optWrap.className = 'chips';
    optWrap.style.marginTop = '10px';
    candidates.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.type = 'button';
      btn.textContent = c.entry.question;
      btn.addEventListener('click', () => handleSearch(c.entry.question));
      optWrap.appendChild(btn);
    });
    wrap.appendChild(optWrap);
    chatLog.appendChild(wrap);
    scrollToBottom();
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'typing';
    el.id = 'typingIndicator';
    el.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    chatLog.appendChild(el);
    scrollToBottom();
  }
  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function handleSearch(text) {
    const trimmed = text.trim();
    if (!trimmed || isLoading) return;
    if (welcome) { welcome.remove(); welcome = null; }

    isLoading = true;
    searchBtn.disabled = true;
    input.value = '';

    renderMessage('user', trimmed);
    showTyping();

    setTimeout(() => {
      hideTyping();
      const matches = findBestMatches(trimmed);
      const CONFIDENT_MIN = 7;      // أقل درجة تُعتبر إجابة معقولة أصلًا - رُفعت لتفادي تخمين أجوبة من تشابه عرضي ضعيف
      const AMBIGUOUS_RATIO = 0.72; // إذا كان مرشح ثاني قريب من الأول بهذه النسبة، ما نجزم بينهم

      if (matches.length === 0 || matches[0].score < CONFIDENT_MIN) {
        renderMessage('assistant', 'ما لقيت إجابة مطابقة لسؤالك بالمعلومات المتوفرة حاليًا. جرّب تصيغ السؤال بكلمات أوضح وأكثر تحديدًا، أو اضغط أحد المواضيع فوق، أو اسأل مشرفك المباشر.');
      } else {
        const top = matches[0];
        const rivals = matches.slice(1, 3).filter(m => m.score >= CONFIDENT_MIN && m.score >= top.score * AMBIGUOUS_RATIO);
        if (rivals.length > 0) {
          renderDisambiguation([top, ...rivals]);
        } else {
          renderAnswerBlock(top.entry, false);
        }
      }
      scrollToBottom();
      isLoading = false;
      searchBtn.disabled = false;
      input.focus();
    }, 350);
  }

  searchBtn.addEventListener('click', () => handleSearch(input.value));
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSearch(input.value); });
  resetBtn.addEventListener('click', () => location.reload());
</script>
</body>
</html>
